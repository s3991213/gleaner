# Every push and pull request: lint, unit tests and a secret scan (the test gate).
# Pushes to main then build one image and promote that same image through
# staging (automatic) and production (after approval), then publish release notes.
#
# Setup: deploy/setup-github-oidc.sh creates the Azure login trust, the GitHub
# environments, the production approval rule and the variables used here.
# Azure login uses OpenID Connect, so no password is stored in GitHub.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main are never cut off mid-deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q
      - name: Deploy script syntax
        run: for f in deploy/*.sh; do bash -n "$f"; done

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full history for secrets (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git /repo --redact --verbose --exit-code 1

  build:
    needs: [test, secret-scan]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.names.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: names
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="sha-${GITHUB_SHA::7}"
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=${repo}:${version}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ steps.names.outputs.version }}
          tags: |
            ${{ steps.names.outputs.image }}
            ${{ steps.names.outputs.repo }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.names.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  staging:
    needs: build
    if: vars.AZURE_CLIENT_ID != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      version: ${{ needs.build.outputs.version }}

  production:
    needs: [build, staging]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      version: ${{ needs.build.outputs.version }}

  release-notes:
    needs: [build, production]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      PREVIOUS: ${{ needs.production.outputs.previous_version }}
      URL: ${{ needs.production.outputs.url }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish a release for this production version
        run: |
          tag="prod-${VERSION}"
          last_tag="$(git tag --list 'prod-*' --sort=-creatordate | head -n 1)"
          range="${last_tag:+${last_tag}..}${GITHUB_SHA}"
          {
            echo "Deployed to production: ${URL}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`ghcr.io/${GITHUB_REPOSITORY,,}:${VERSION}\` |"
            echo "| Replaced | \`${PREVIOUS:-unknown}\` |"
            echo "| Deployed (UTC) | $(date -u '+%Y-%m-%d %H:%M') |"
            echo
            echo "## Changes"
            git log --no-merges --format='- %s (%h)' "${range}"
            echo
            echo "## Roll back"
            echo "Actions, Rollback, Run workflow: environment \`production\`, version \`${PREVIOUS:-<previous version>}\`."
          } > notes.md
          gh release create "${tag}" --target "${GITHUB_SHA}" \
            --title "Production ${VERSION} ($(date -u '+%Y-%m-%d'))" --notes-file notes.md
